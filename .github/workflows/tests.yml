name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Compiler and sandbox (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install LaTeX and PDF tools
        run: brew install tectonic poppler

      - name: Install headless terminal renderer
        run: brew install --cask kitty

      - name: Prepare offline LaTeX resources
        run: |
          tectonic --outdir "$RUNNER_TEMP" tests/fixtures/two-pages.tex
          tectonic --outdir "$RUNNER_TEMP" tests/fixtures/resume.tex

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests with coverage
        run: >-
          cargo llvm-cov --locked --all-targets --lcov
          --output-path target/lcov.info
          -- --include-ignored --test-threads=1
          --skip live_dummy_edit_latency
          --skip live_agent_latency_comparison

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: target/lcov.info
          flags: ${{ matrix.runner }}
          disable_search: true
          fail_ci_if_error: true

  compatibility:
    name: Core and terminal engines (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config bubblewrap apparmor-profiles

          # Ubuntu ships this profile disabled. Enable it for Bubblewrap's namespace setup;
          # the sandboxed compiler still has no capabilities or host network access.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run portable Rust tests
        run: cargo test --locked --all-targets

      - name: Verify Linux sandbox restrictions
        if: runner.os == 'Linux'
        run: cargo test --locked --lib sandbox::tests::sandbox_ -- --include-ignored --test-threads=1

      - name: Build application
        run: cargo build --locked

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install terminal test dependencies
        id: terminal-dependencies
        run: npm ci --prefix tests/tui

      - name: Test Alacritty engine
        run: node --test tests/tui/compatibility.test.mjs
        env:
          TEXO_TUI_BACKEND: alacritty
          NO_COLOR: ''

      - name: Test Ghostty engine
        if: ${{ !cancelled() && steps.terminal-dependencies.outcome == 'success' }}
        run: node --test tests/tui/compatibility.test.mjs
        env:
          TEXO_TUI_BACKEND: ghostty
          NO_COLOR: ''

      - name: Upload terminal artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: terminal-${{ matrix.runner }}
          path: target/tui-artifacts
          if-no-files-found: ignore
