[package]
name = "texo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tempfile = "3.27.0"
textwrap = "0.16.4"
directories = "6"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
zeroize = "1"
similar = "3.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
