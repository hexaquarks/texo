[package]
name = "texo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
kitty-graphics-protocol = "0.1.3"
rand = "0.10"
ratatui-textarea = { version = "0.9.3", features = ["search"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tempfile = "3.27.0"
textwrap = "0.16.4"
directories = "6"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
zeroize = "1"
similar = "3.2.0"
toml_edit = { version = "0.25", features = ["serde"] }
open = "5.4.5"
crokey = "1.5.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
ratatui-spinner = { git = "https://github.com/ratatui/ratatui-spinner", rev = "4489de894e1a29460b5976508b1a25499c3ba3b0", version = "0.4.18" }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
regex = "1.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

# Keep image resampling responsive with `cargo run`, including on Retina displays.
[profile.dev.package.image]
opt-level = 3
